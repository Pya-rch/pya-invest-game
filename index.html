<!doctype html><html lang='ja'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>株と街のものがたり</title><style>body{font-family:system-ui;background:#eaf2e9;margin:0;color:#253c32}main{max-width:600px;margin:auto;min-height:100vh;background:#fffdf6;padding:24px;box-sizing:border-box}header{background:#24543e;color:white;padding:25px;border-radius:20px}h1{font-size:25px}#scene{line-height:1.9;white-space:pre-line;font-size:17px;margin:30px 0}button{display:block;width:100%;padding:15px;margin:10px 0;border:1px solid #aac6b4;border-radius:12px;background:white;color:#214e39;text-align:left;font-size:15px}button:hover{background:#eaf5eb}.next{background:#24543e;color:white;text-align:center}.info{background:#edf4e9;padding:15px;border-radius:12px;line-height:1.8}</style><main><header><small>PYĀ INVEST GAME · 体験版</small><h1>🌿 株と街のものがたり</h1><div id='chapter'></div></header><div id='scene'></div><div id='choices'></div><button onclick='i=0;show()'>↺ 最初から</button><small>架空の投資教育ゲーム。実際の投資成果を予測するものではありません。</small></main><script>const S=[['第1章｜一枚の株券','あなたは小さな街にやってきた。パン屋のミナが、新しいオーブンを買う資金について悩んでいる。','パン屋に入る'],['第1章｜一枚の株券','ミナ「会社をつくって株式を発行すれば、事業の資金を集められるんだって！」\n\n株を買うとはどういうこと？',[['会社にお金を貸す','× 株は貸付ではなく、会社の所有権の一部だよ。'],['会社の所有権の一部を持つ','○ 正解！ 株主は会社の所有者の一人になる。'],['商品を無料でもらう','× 株主優待がある会社もあるけど、株の本質は所有権だよ。']]],['第1章｜一枚の株券','古書店のユイ「既に発行された株を取引所で買う場合、通常は会社ではなく売った投資家に代金が渡るの」','次へ'],['第2章｜最高の決算、最悪の朝','パン屋の会社が過去最高益を発表！ ところが株価は急落。なぜ？',[['良い決算なら株価は必ず上がる','× 将来の期待がすでに株価に織り込まれている場合もある。'],['市場がもっと良い決算を期待していた','○ その通り！ 株価は実績だけでなく期待にも左右される。'],['株価は会社が自由に決める','× 市場での売買注文によって取引価格が決まる。']]],['第2章｜最高の決算、最悪の朝','商人レオ「みんな怖がって売っている！」\nユイ「株価は売りたい人と買いたい人の注文が合うところで決まる。恐怖は需給に影響するけれど、結果は買い手次第なの」','次へ'],['第2章｜最高の決算、最悪の朝','中央銀行が利上げを発表した。株価にどんな影響があり得る？',[['将来利益の現在価値が下がる方向に働く','○ 正解！ 借入費用や他の運用先との比較も関係する。ただし影響は一律ではない。'],['すべての株が必ず暴落する','× 金利の影響は企業や景気環境によって違う。']]],['エピローグ','ユイ「数字だけでなく、人々の期待と恐れも価格を動かす。でも本当の原因は一つとは限らないのよ」\n\n第3章：噂と群集心理へ続く…','もう一度遊ぶ']];let i=Number(localStorage.getItem('kabu-progress')||0);if(i>=S.length)i=0;function show(){localStorage.setItem('kabu-progress',i);let s=S[i];document.getElementById('chapter').textContent=s[0];document.getElementById('scene').textContent=s[1];let c=document.getElementById('choices');c.innerHTML='';if(Array.isArray(s[2])){s[2].forEach(([label,explain])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{c.innerHTML='';let p=document.createElement('p');p.className='info';p.textContent=explain;c.append(p);nextButton(c)};c.append(b)})}else nextButton(c,s[2])}function nextButton(c,label='次へ →'){let b=document.createElement('button');b.className='next';b.textContent=label;b.onclick=()=>{i=(i+1)%S.length;show()};c.append(b)}show()</script></html>
