<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>株と街のものがたり｜市場の見えない予想</title><style>*{box-sizing:border-box}body{margin:0;background:#e7eee9;color:#263c32;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:650px;margin:auto;min-height:100dvh;background:#fffcf5;box-shadow:0 0 30px #234a3220}header{background:#254d40;color:#fff;padding:24px}header small{opacity:.75;letter-spacing:.09em}h1{font-size:24px;margin:8px 0}header p{font-size:13px;line-height:1.7}.body{padding:22px}.progress{height:5px;background:#dce5db}.progress>div{height:100%;background:#d9b46c}.scene{border-radius:18px;background:linear-gradient(150deg,#c5d5cc,#f3e4c6);height:110px;display:flex;align-items:center;justify-content:center;font-size:37px;margin:12px 0 25px}.label{font-size:12px;font-weight:800;color:#58785d;letter-spacing:.06em}.speaker{font-size:15px;font-weight:800;color:#376347;margin-top:15px}.story{white-space:pre-line;line-height:2.05;font-size:16px;margin:12px 0 24px;min-height:125px}button{font:inherit;line-height:1.65;padding:13px 15px;border:1px solid #b5c6b6;border-radius:12px;background:white;color:#284a37;text-align:left;cursor:pointer}button.primary{background:#2b694f;color:white;text-align:center;font-weight:800;border-color:#2b694f}.choices{display:grid;gap:10px}.note{background:#f0f4eb;border-left:4px solid #79a185;padding:16px;line-height:1.85;border-radius:9px;font-size:14px;white-space:pre-line;margin:15px 0}.lesson{background:#f7edcf;padding:17px;border-radius:12px;font-size:14px;line-height:1.9;white-space:pre-line;margin:15px 0}.bar{display:flex;justify-content:space-between;gap:8px;margin-top:30px}.bar button{flex:1;text-align:center;font-size:13px}.meta{font-size:12px;color:#69816f;line-height:1.8;margin-top:18px}.tag{display:inline-block;background:#e5eee4;border-radius:99px;padding:5px 10px;font-size:12px;color:#416a4a;margin:4px 4px 4px 0}.ending{background:#edf4eb;padding:17px;border-radius:14px;line-height:1.9}</style></head><body><main><header><small>PYĀ INVEST GAME · PROTOTYPE 05</small><h1>🌿 株と街のものがたり</h1><p>第6章・続編「市場の見えない予想」<br>誰の話を聞く？ 利上げを、市場はどこまで織り込んでいる？</p><a href="prototype04.html" style="color:#e2f0e2;font-size:12px">前作：雨の日のオーブン</a></header><div class="progress"><div id="progress"></div></div><div class="body"><div class="label" id="label"></div><div class="scene">🏘️　📰　📈</div><div class="speaker" id="speaker"></div><div class="story" id="story"></div><div id="extra"></div><div class="choices" id="choices"></div><div class="bar"><button id="back">← 前の場面</button><button id="restart">↺ 別の展開で最初から</button></div><div class="meta">市場環境はプレイ開始時に抽選（40%・35%・25%）。架空の確率・株価変動を用いた学習用ゲームです。現実の市場予測や投資助言ではありません。</div></div></main><script>const stages=[{"label":"第一幕｜12月の噂","speaker":"語り手","text":"12月の冷たい風が、街の広場を抜けていく。\n\n中央銀行の発表まで、あと二日。\n\n『今度こそ利上げか？』という見出しが、新聞の一面を飾っていた。\n\nパン屋のミナは、新しいオーブンの借入を迷っている。一方、広場の株式市場では、発表前から株価が下がり始めていた。"},{"speaker":"ミナ","text":"「金利が上がったら、うちの借入も高くなるのよね。だったら株も下がるんでしょ？」\n\n古書店のユイが、新聞を折りたたむ。\n\n「金利の影響はある。でも、もう株価が下がっているのが気になるわ。発表の前なのにね」"},{"type":"lesson","speaker":"ユイ","text":"「市場は発表を待ってから動くとは限らないの。投資家が『利上げになりそう』と考えれば、その時点で売買が起きる」\n\n「だから発表当日は、利上げしたかどうかだけじゃなく、事前の予想とどれくらい違ったかが重要になることがあるのよ」","lesson":"学び：株価は未来への期待を先取りして動くことがある。利上げ＝必ず当日下落、ではない。"},{"type":"branch","label":"調査｜誰の話を聞く？","speaker":"ユイ","text":"「発表前に一人だけ話を聞く時間があるわ。誰を訪ねる？」\n\nあなたの選択で、入手する手掛かりが変わる。","options":[["商人レオ｜売買している人の空気を探る","leo"],["銀行員サトウ｜金利と債券市場の数字を聞く","sato"],["新聞記者ハナ｜専門家の予測を聞く","hana"]]},{"type":"clue","speaker":"語り手","text":""},{"type":"lesson","speaker":"ユイ","text":"「今の手掛かりは、街の一部を見ただけのもの。投資家全員の頭の中は見えないし、調査対象が偏っている可能性もある」\n\n「でも、何も調べずに『利上げだから下落』と決めつけるより、一歩前進ね」","lesson":"学び：市場の期待は直接観測できない。株価・金利先物・調査・取引動向などを手掛かりに推定する。ただし、どれも完全な答えではない。"},{"type":"decision","label":"判断｜発表の前夜","speaker":"ミナ","text":"「利上げが来るかもしれない。でも、株価はもう下がっている……」\n\n「あなたなら、発表前にどうする？」\n\nこの章では架空の株を少額保有している設定。判断後、同じニュースでも違う結果が起こり得る。","options":[["株を売って、発表を待つ","sell"],["保有を続ける","hold"],["少しだけ買い増す","buy"]]},{"type":"event","label":"第二幕｜発表の日","speaker":"語り手","text":""},{"type":"analysis","speaker":"ユイ","text":""},{"type":"ending","label":"終幕｜同じニュース、違う反応","speaker":"語り手","text":"ミナは広場の値動きを眺めて、ゆっくりうなずいた。\n\n「ニュースの内容だけじゃなくて、みんなが何を予想していたかも大事なんだね」\n\nユイは笑う。「そして、予想は確率でしか語れないことが多い。正しい判断でも損する日はあるし、偶然の利益が優れた分析の証拠とも限らない」"}];const scenarios=[{id:"priced",name:"利上げはかなり織り込み済み",prob:40,move:1.2,description:"予想どおりの小幅利上げ。声明が市場の警戒より穏やかだったため、株価はむしろ上昇した。",clues:{leo:"レオは言った。「周りはもう何週間も前から売ってる。利上げは当たり前だってさ」",sato:"サトウは資料を指す。「市場の金利指標には、利上げをかなり見込んだ水準が出ています。ただし確定ではありません」",hana:"ハナは取材ノートを見せた。「聞いた専門家の多くは小幅利上げ予想。でも調査に答えない投資家もいるわ」"}},{id:"surprise",name:"市場は据え置きを優勢視",prob:35,move:-4.8,description:"予想外の利上げに加え、今後も引き締めを続ける示唆。株価は大きく下落した。",clues:{leo:"レオは言った。「売ってる人もいるけど、みんな結局は据え置きだと思ってるみたいだ」",sato:"サトウは資料を指す。「市場の金利指標は据え置き寄りです。利上げなら予想との差が大きいでしょう」",hana:"ハナは取材ノートを見せた。「専門家の大半は据え置き予想。ただし意外な発表もあり得るわ」"}},{id:"hawkish",name:"市場はもっと大幅な利上げを警戒",prob:25,move:3.4,description:"実際には小幅利上げ。市場が恐れていた大幅利上げは回避され、株価は上昇した。",clues:{leo:"レオは肩をすくめた。「この街じゃ、もっと大きく上げるって噂で皆びくびくしてるよ」",sato:"サトウは資料を指す。「市場の金利指標は、比較的大幅な引き締めを警戒しているようです」",hana:"ハナは取材ノートを見せた。「強い利上げ予想が増えてる。でも、どこまで本気かは分からないわ」"}}];let state;try{state=JSON.parse(localStorage.getItem("pya-invest-v5")||"null")}catch{}if(!state||!Number.isInteger(state.i)||state.i<0||state.i>=stages.length){state={i:0,scenario:Math.random()<.4?0:Math.random()<.583333?1:2,source:null,action:null}}const $=id=>document.getElementById(id);function save(){localStorage.setItem("pya-invest-v5",JSON.stringify(state))}function next(){state.i=Math.min(stages.length-1,state.i+1);save();render()}function choice(label,cb,primary=false){const b=document.createElement("button");b.textContent=label;if(primary)b.className="primary";b.onclick=cb;$("choices").append(b)}function render(){const s=stages[state.i],sc=scenarios[state.scenario];$("label").textContent=s.label||"第6章｜市場の見えない予想";$("speaker").textContent=s.speaker;$("story").textContent=s.text;$("choices").replaceChildren();$("extra").replaceChildren();$("progress").style.width=(100*(state.i+1)/stages.length)+"%";$("back").disabled=state.i===0;if(s.type==="branch"){s.options.forEach(([t,v])=>choice(t,()=>{state.source=v;next()}))}else if(s.type==="clue"){$("speaker").textContent=state.source==="leo"?"レオ":state.source==="sato"?"サトウ":"ハナ";$("story").textContent=sc.clues[state.source||"hana"]+"\n\nあなたは手帳に書き留めた。『これは手掛かり。でも市場全体の確かな答えではない』。";choice("手掛かりを持って戻る →",next,true)}else if(s.type==="decision"){s.options.forEach(([t,v])=>choice(t,()=>{state.action=v;next()}))}else if(s.type==="event"){$("story").textContent="鐘が鳴る。中央銀行は、政策金利の引き上げを発表した。\n\n『やっぱり利上げだ！』とレオが叫ぶ。\n\nしかし、株価ボードの数字が動いた瞬間、広場が静まり返った。";const d=document.createElement("div");d.className="note";d.textContent="本日の架空株価変動："+(sc.move>0?"+":"")+sc.move.toFixed(1)+"%\n\n"+sc.description;$("extra").append(d);choice("なぜこうなった？ →",next,true)}else if(s.type==="analysis"){$("story").textContent="ユイ「利上げという発表は同じでも、事前にどれだけ織り込まれていたかで反応が変わったの。今回は『"+sc.name+"』という市場環境だった」";const d=document.createElement("div");d.className="lesson";const delta=state.action==="sell"?0:state.action==="buy"?sc.move*1.5:sc.move;d.textContent="あなたの選択："+({sell:"発表前に売却",hold:"保有を継続",buy:"買い増し"}[state.action]||"保有") +"\n架空の短期損益率（参考）："+(delta>0?"+":"")+delta.toFixed(1)+"%\n\n"+(state.action==="sell"?"値下がりリスクを避けた一方、値上がりの機会も逃す。":state.action==="buy"?"買い増しで変動の影響を拡大した。":"保有を続け、価格変動をそのまま受けた。")+"\n\n※買い増しの1.5倍は教材用の仮定。売却前の損益や手数料は含まない。";$("extra").append(d);choice("物語の結末へ →",next,true)}else if(s.type==="ending"){const d=document.createElement("div");d.className="ending";d.textContent="今回の隠れた市場環境："+sc.name+"（発生確率："+sc.prob+"%）\n\n同じ利上げ発表でも、事前の期待や声明内容によって値動きは変わる。あなたが聞いた証言も、その一部にすぎなかった。";$("extra").append(d);choice("別の展開でもう一度遊ぶ ↺",()=>{const n=Math.random()*100;state={i:0,scenario:n<40?0:n<75?1:2,source:null,action:null};save();render()},true)}else{if(s.type==="lesson"){const d=document.createElement("div");d.className="lesson";d.textContent=s.lesson;$("extra").append(d)}choice("続きを読む →",next,true)}}$("back").onclick=()=>{if(state.i>0){state.i--;save();render()}};$("restart").onclick=()=>{if(confirm("別の市場環境で最初から始めますか？")){const n=Math.random()*100;state={i:0,scenario:n<40?0:n<75?1:2,source:null,action:null};save();render()}};render();</script></body></html>
