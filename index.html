<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244c3e"><title>株と街のものがたり｜第2部</title><style>*{box-sizing:border-box}body{margin:0;background:#e7efe8;color:#243d32;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:660px;margin:auto;background:#fffdf7;min-height:100dvh;padding-bottom:25px}header{background:linear-gradient(145deg,#244c3e,#53836b);color:white;padding:28px 22px}h1{font-size:25px;margin:10px 0}header p{font-size:14px;line-height:1.7;color:#e1eee6}.bar{height:6px;background:#d7e6d8}.bar div{height:100%;background:#e2ad59;transition:width .2s}.content{padding:25px 22px}.chapter{font-size:13px;color:#4d795d;font-weight:800}.scene{background:#f1f4e9;border-radius:18px;padding:22px 18px;line-height:1.95;white-space:pre-line;margin:17px 0;font-size:16px}.question{font-weight:800;line-height:1.7;margin:20px 0 14px}.choices{display:grid;gap:10px}button{border:1px solid #a9c2b0;background:white;color:#244b38;border-radius:12px;padding:15px;text-align:left;font:inherit;line-height:1.55;cursor:pointer}button.primary{background:#286348;color:white;border:0;text-align:center;font-weight:700}button:disabled{opacity:.5}.feedback{background:#e9f2e6;border-left:4px solid #79a37c;border-radius:10px;padding:16px;margin:20px 0;line-height:1.8}.small{font-size:12px;color:#657d6b}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.chip{background:#e9f1e9;border-radius:99px;padding:6px 10px;font-size:12px}.menu{display:grid;gap:10px;margin:20px 0}.menu button{display:flex;justify-content:space-between}.nav{display:flex;gap:10px;margin-top:25px}.nav button{flex:1;font-size:13px;text-align:center}.end{font-size:19px;line-height:1.8;font-weight:700}</style></head><body><main><header><small>PYĀ INVEST GAME · 第2部 / PROTOTYPE 03</small><h1>🌿 株と街のものがたり</h1><p>見えない経済の力。金利、物価、景気、為替——街で起こる事件から学ぶ投資推理ノベル。</p></header><div class="bar"><div id="progress"></div></div><section class="content"><div class="top"><span id="chapter" class="chapter"></span><span id="counter" class="chip"></span></div><div id="scene" class="scene"></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback"></div><div class="nav"><button id="menuBtn">章を選ぶ</button><button id="resetBtn">最初から</button></div><p class="small">教育用フィクション。価格変動には複数の要因があり、投資結果を保証するものではありません。進捗はこの端末内に保存されます。</p></section></main><script>const chapters=[{"title":"第6章｜金利が上がると何が起きる？","intro":"朝の広場。パン屋のミナが、新しいオーブンの見積書を握りしめている。\n「先月よりローンの支払いが増えるって。どうして？」\n古書店のユイが新聞を開く。中央銀行が政策金利を引き上げたらしい。あなたは街の銀行へ向かった。","questions":[["銀行の窓口で、ミナがため息をつく。「金利が上がると借りる側には何が起こりやすいの？」","借入金利が上がった場合、一般に？",["返済負担が増えやすい","借入費用は必ずゼロになる","すべての借金が即日返済になる"],0,"金利上昇は新規借入や変動金利借入の負担を増やし得る。ただし固定金利など契約条件で影響は異なる。"],["銀行の前で、債券を持つ老人が青ざめる。「新しい債券の利回りが高いなら、私の古い債券は？」","同条件で市場金利が上昇したとき、既存の固定利付債券の価格は？",["一般に下がる","必ず上がる","変わらないと法律で決まっている"],0,"新発債の利回りが高くなると、低い利息の既存債券は相対的に魅力が低下し、市場価格が下がりやすい。"],["ユイが将来の利益を描いた紙を差し出す。「10年後の100万円と今日の100万円は同じ価値かしら？」","割引率が上がると将来利益の現在価値は？",["一般に低くなる","必ず高くなる","利益の金額が自動で増える"],0,"将来のキャッシュフローを現在価値に換算するとき、割引率が高いほど現在価値は低くなる。長期の成長期待が大きい株ほど影響を受ける場合がある。"],["発明工房の社長は借入で新工場を建てる計画だ。一方、銀行員は利ざやを気にしている。「同じ利上げでも会社ごとに違うのね」","利上げの株価への影響として最も適切なのは？",["企業の事業構造や景気次第で異なる","すべての株が必ず30%下落する","銀行株だけは必ず上昇する"],0,"金利は資金調達費用、需要、割引率など複数経路で作用する。金融機関も預金コストや信用損失の影響を受ける。"],["夜、ミナはオーブンの購入を延期しようか迷う。ユイは「利上げの目的も考えて」と促す。","中央銀行がインフレ抑制のため利上げする主な狙いは？",["借入や支出を抑え物価上昇圧力を和らげる","すべての商品の値段を即日固定する","株式市場を必ず上昇させる"],0,"金融引き締めは資金調達や需要を通じて物価上昇圧力を抑える狙いがある。効果には時間差があり、副作用もある。"]]},{"title":"第7章｜物価が上がる街","intro":"翌週、パン屋の前に長い列ができた。けれどミナは浮かない顔。\n「パンは売れているのに、小麦粉も電気代も上がっているの」\n市場の掲示板には『物価上昇』の文字。あなたは街の家計と企業の数字を調べることにした。","questions":[["ミナが値札を書き換える。「去年100円だったパンが110円になった。でもみんなの給料は変わらない」","同じ収入で物価が上がると、一般に？",["買える量が減る","購買力が必ず増える","貯金の額面が自動で増える"],0,"名目収入が変わらず物価が上がると、実質的な購買力は低下する。"],["パン屋の帳簿を開く。売上は前年比15%増、材料費は25%増。「売上が増えたなら安心？」","利益を判断するために必要なのは？",["売上だけでなく費用も見る","売上が増えれば利益も必ず増える","商品の人気だけを見る"],0,"売上増でもコストがそれ以上に上がれば利益率は悪化し得る。価格転嫁できるかが重要。"],["ユイが二つの会社を指す。値上げしても客が離れない人気店と、値上げすると客が去る店。","インフレ下で価格転嫁しやすい企業の特徴は？",["顧客が価値を感じ代替されにくい","必ず最も小さい企業","借金が多いことだけ"],0,"ブランド、差別化、需要の強さなどによって価格決定力は異なる。ただし値上げには限界がある。"],["広場でレオが叫ぶ。「現金なら数字が減らないから絶対安全！」ユイは首をかしげる。","インフレ時に現金を長く保有するリスクは？",["実質購買力が目減りし得る","額面が毎日自動的に半減する","現金には一切リスクがない"],0,"現金の額面は一定でも、物価が上がれば同じ金額で買えるものは減る。流動性の利点とは別に考えよう。"],["市役所が『インフレ率が低下』と発表。レオは「じゃあ値段が下がる！」と喜ぶ。","インフレ率が5%から2%に下がったとは？",["価格の上昇ペースが鈍化した","物価水準が3%下がった","すべての価格が固定された"],0,"インフレ率の低下（ディスインフレ）は通常、物価が上がり続けても上昇率が鈍ること。物価自体の下落（デフレ）とは違う。"]]},{"title":"第8章｜景気が冷え込む日","intro":"秋。街の鉄道の乗客が減り、パン屋の午後の客足も鈍くなった。\n「不況が来るのかな？」ミナが不安そうに尋ねる。\nしかし発明工房は新製品を発表し、忙しそうだ。街全体の景気と個々の会社は、同じではないらしい。","questions":[["鉄道会社が利用者数の減少を発表。ミナの売上も鈍っている。","景気後退時に企業で起こりやすいことは？",["需要減で売上や利益が圧迫される","全企業の利益が必ず増える","株価は景気と無関係になる"],0,"需要減少は多くの企業の業績に影響するが、生活必需品など影響が相対的に小さい分野もある。"],["市役所の職員が言う。「会社が採用を減らすと、家計も支出を控えるかもしれない」","この連鎖に近い説明は？",["所得と消費の減少が需要をさらに弱める","失業が増えると消費が必ず倍になる","景気は企業だけの問題"],0,"雇用・所得・消費・企業収益は相互に作用し、景気悪化が波及することがある。"],["レオは『不況だから全株売るべき』と叫ぶ。ユイは企業の違いを見ようと言う。","景気後退に対する適切な見方は？",["業種・財務体質・価格により影響が異なる","すべての株が同じ割合で下がる","不況時には株価の分析が不可能"],0,"景気敏感株とディフェンシブ株、負債の多寡などで影響は異なる。株価は将来予想を先取りすることもある。"],["発明工房は新製品が好調なのに株価が低迷。ミナは「市場は景気の先を見ている？」とつぶやく。","株価と景気の関係として適切なのは？",["将来予想を先取りし景気指標とずれることがある","株価は過去のGDPだけで決まる","景気が悪い間は株価が絶対上がらない"],0,"株価は将来の利益や金利を織り込むため、足元の景気と逆方向に動くこともある。"],["ユイが投資手帳を開く。「不況が怖いときほど、まず生活費を考えて」","投資資金の管理で大切なのは？",["近い将来使う資金と長期運用資金を分ける","生活費をすべて値動きの大きい株に入れる","暴落を確実に予言できる人を探す"],0,"生活防衛資金や投資期間、リスク許容度を踏まえた資金管理は、相場予想よりも重要な土台になる。"]]},{"title":"第9章｜海の向こうのニュース","intro":"冬の港に、海外から小麦粉を積んだ船が到着した。\nミナは請求書を見て驚く。「同じ小麦粉なのに、前より高い！」\n一方、海外に商品を売る発明工房は笑顔だ。為替、海外景気、ニュース。遠くの出来事がこの街にも届いている。","questions":[["港の商人が説明する。「外国のお金を買うのに、前より多くの円が必要になったんだ」","円安とは一般に？",["円の他通貨に対する価値が下がること","円の購買力が国内で必ず倍になること","輸入品が必ず安くなること"],0,"円安は外国通貨に対する円の価値の低下。外貨建て輸入価格の円換算額が上がりやすい。"],["ミナは輸入小麦の値上がりに困り、海外に商品を売る工房は円換算売上の増加を喜ぶ。","円安の企業への影響は？",["輸入と輸出の構造などで異なる","国内の全企業に同じ利益をもたらす","必ずすべての株価を下げる"],0,"輸入原価、外貨建て売上、海外生産、為替ヘッジなどで影響は異なる。"],["海の向こうの国で景気が悪化したというニュース。工房の海外注文が減り始めた。","海外景気の悪化が国内企業に伝わる経路は？",["輸出需要やサプライチェーンを通じて","海外のニュースは国内に影響しない","必ず国内の賃金が即日ゼロになる"],0,"貿易、投資、物流、金融市場などを通じて海外の変化が波及する。"],["レオが匿名の掲示板を見せる。「港が閉鎖されるらしい！ 今すぐ売ろう！」しかし出所が分からない。","投資判断前に最も大切な行動は？",["一次情報や複数の信頼できる情報源を確認する","噂を見たら必ず即売却する","最も強い言葉の投稿を信じる"],0,"未確認情報は誤りや誇張を含み得る。情報源、日時、事実と推測を分けて検証しよう。"],["港が落ち着き、街の市場も少し静かになった。ユイが問う。「一つのニュースで、投資判断を全部変える？」","複雑なニュースに向き合う姿勢として適切なのは？",["複数要因と不確実性を考え、投資方針に照らす","ニュースの見出しだけで必ず売買する","価格変動の原因は常に一つだと決める"],0,"為替、金利、業績、期待、心理は重なり合う。ニュースが価格に織り込まれている可能性も考える。"]]}];let ci=0,qi=-1,answered=false,score=0;try{const saved=JSON.parse(localStorage.getItem("pya-invest-part2")||"{}");ci=saved.ci||0;qi=saved.qi??-1;score=saved.score||0;if(ci>=chapters.length||ci<0)ci=0}catch{}const E=id=>document.getElementById(id);function save(){localStorage.setItem("pya-invest-part2",JSON.stringify({ci,qi,score}))}function button(label,fn,primary=false){let b=document.createElement("button");b.textContent=label;if(primary)b.className="primary";b.onclick=fn;E("choices").append(b)}function next(){answered=false;if(qi<4){qi++}else if(ci<chapters.length-1){ci++;qi=-1}else{qi=5}save();render()}function render(){const c=chapters[ci];E("chapter").textContent=c.title;E("counter").textContent=qi<0?"物語":qi>=5?"クリア":(qi+1)+"/5";E("progress").style.width=((ci*6+Math.max(0,qi+1))/24*100)+"%";E("choices").replaceChildren();E("feedback").replaceChildren();E("question").textContent="";if(qi<0){E("scene").textContent=c.intro;button("事件を調べる →",next,true)}else if(qi<5){const q=c.questions[qi];E("scene").textContent=q[0];E("question").textContent=q[1];q[2].forEach((a,j)=>button(a,()=>{if(answered)return;answered=true;if(j===q[3])score++;const d=document.createElement("div");d.className="feedback";d.textContent=(j===q[3]?"✓ 正解！ ":"ここがポイント。 ")+q[4];E("feedback").append(d);E("choices").replaceChildren();button(qi===4?"次の章へ →":"物語を続ける →",next,true);save()}))}else{E("scene").innerHTML="<div class='end'>🎉 第2部をクリア！</div>金利・物価・景気・為替の20の事件を乗り越えた。次は投資家心理の謎へ。";button("もう一度挑戦",()=>{ci=0;qi=-1;score=0;save();render()},true)}}E("menuBtn").onclick=()=>{E("scene").textContent="どの章から遊ぶ？";E("question").textContent="章を選択";E("feedback").replaceChildren();E("choices").replaceChildren();chapters.forEach((c,i)=>button(c.title,()=>{ci=i;qi=-1;answered=false;save();render()}))};E("resetBtn").onclick=()=>{if(confirm("進捗を最初からに戻しますか？")){ci=0;qi=-1;score=0;save();render()}};render();</script></body></html>
