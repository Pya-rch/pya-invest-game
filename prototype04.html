<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254b3e"><title>株と街のものがたり｜雨の日のオーブン</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#293d33;background:#e9efe8}*{box-sizing:border-box}body{margin:0}main{max-width:650px;min-height:100dvh;margin:auto;background:#fffdf7;box-shadow:0 0 35px #1b44301a}header{background:linear-gradient(145deg,#244b3e,#49745c);color:white;padding:25px 24px}header small{letter-spacing:.1em;opacity:.75}h1{font-size:25px;margin:8px 0}header p{font-size:13px;color:#e2f0e6;line-height:1.6}.progress{height:5px;background:#d6e2d7}.progress>div{height:100%;background:#d8af62;transition:width .3s}.body{padding:22px 23px 28px}.chapter{color:#52745c;font-size:12px;letter-spacing:.08em;font-weight:800}.scene-art{height:116px;border-radius:17px;background:linear-gradient(180deg,#c2d3cf,#e7ddc2 74%,#99b49b 74%);display:flex;align-items:end;justify-content:center;padding-bottom:13px;font-size:35px;margin:17px 0 24px}.speaker{font-size:14px;font-weight:800;color:#35684b}.story{font-size:16px;line-height:2.05;white-space:pre-line;margin:12px 0 24px;min-height:155px}.prompt{font-weight:800;margin:0 0 12px;font-size:15px}.choices{display:grid;gap:10px}button{font:inherit;line-height:1.6;padding:14px 16px;border:1px solid #b7cab9;background:#fff;color:#284c37;border-radius:12px;text-align:left;cursor:pointer}button.primary{background:#2c684e;color:#fff;border-color:#2c684e;text-align:center;font-weight:800}button:disabled{opacity:.45}.result{border-left:4px solid #85a78b;background:#f0f5ec;border-radius:8px;padding:16px;margin:18px 0;line-height:1.9;font-size:14px;white-space:pre-line}.lesson{background:#f7efdb;border-radius:14px;padding:17px;margin:15px 0 20px}.lesson h3{margin:0 0 8px;font-size:15px}.lesson p{line-height:1.85;margin:0;font-size:14px}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:30px}.bottom button{font-size:13px;flex:1;text-align:center}.hint{color:#6e8173;font-size:12px;line-height:1.7;margin-top:18px}.small{font-size:12px;color:#e7f1e7}.end{font-weight:700;color:#35684b}</style></head><body><main><header><small>PYĀ INVEST GAME · PROTOTYPE 04</small><h1>🌿 株と街のものがたり</h1><p>第6章「雨の日のオーブン」——選んだ言葉で会話が変わる、投資推理ノベル。</p><a class="small" href="part2-quiz.html">前バージョン（問題集形式）</a></header><div class="progress"><div id="bar"></div></div><section class="body"><div class="chapter" id="chapter"></div><div class="scene-art">🌧️　🏠　🥐　☕</div><div class="speaker" id="speaker"></div><div class="story" id="story"></div><div id="lesson"></div><div id="prompt" class="prompt"></div><div class="choices" id="choices"></div><div id="result"></div><div class="bottom"><button id="back">← 前の場面</button><button id="restart">↺ 最初から</button></div><div class="hint">架空の街を舞台にした学習用作品です。投資成果を保証するものではありません。進捗は端末に保存されます。</div></section></main><script>const scenes=[{"type":"narrative","label":"プロローグ｜雨の閉店時間","speaker":"語り手","text":"雨が、石畳を細い糸のように濡らしていた。\n\nあなたがパン屋〈こむぎの窓〉に入ると、いつもなら焼きたての匂いがする店内に、紙の擦れる音だけが響いていた。\n\n店主のミナは二枚の見積書を並べ、鉛筆をくるくる回している。"},{"type":"narrative","speaker":"ミナ","text":"「来てくれたんだ。ちょうど相談したかったの」\n\n「新しいオーブンがあれば、朝のパンをもっと焼ける。でも銀行の人に『今月から借入金利が上がります』って言われてね」\n\nミナは笑おうとして、やめた。\n\n「先月までの計画が、急に怖くなっちゃった」"},{"type":"narrative","speaker":"語り手","text":"見積書の端に、小さな数字が書かれている。\n\nオーブン代は120万円。ミナの貯金だけでは足りない。\n\n窓の外では、広場の時計が六時を打った。あなたは椅子を引いて、ミナの向かいに座る。"},{"type":"choice","label":"会話選択 1 / 3","speaker":"ミナ","text":"「ねえ、あなたならどうする？ このオーブン、買うべきかな」\n\n答えは一つではなさそうだ。","prompt":"主人公のセリフを選ぶ","options":[{"text":"「新しいオーブンで売上が伸びるなら、今買う価値はありそう」","reply":"ミナ「うん。機会を逃すのも怖いんだ。じゃあ、どれだけ増えれば元が取れるんだろう？」","insight":"投資による収益増を考える視点。ただし売上ではなく、費用を差し引いた追加の利益を確認したい。","tone":"前向き"},{"text":"「金利が上がったなら、いったん延期するのも手だと思う」","reply":"ミナ「そうだよね。でも待っている間、朝の行列はどうなるんだろう」","insight":"資金調達コストを警戒する視点。延期にも売上機会を失うコストがある。","tone":"慎重"},{"text":"「まず、増える利益と借入の負担を数字で比べよう」","reply":"ミナ「そうか。怖いって気持ちだけで決めなくてもいいんだね」","insight":"追加利益と資金調達費用を比較する視点。もっとも、数字には予測の不確実性が残る。","tone":"分析的"}]},{"type":"narrative","label":"第一幕｜銀行の手帳","speaker":"語り手","text":"翌朝、二人は銀行へ向かった。\n\n窓口で担当者のサトウが電卓を置く。\n\n「説明のため、100万円を1年間借りて、1年後に元本と利息をまとめて返す単純な例で考えましょう。手数料はないものとします」"},{"type":"lesson","speaker":"サトウ（銀行員）","text":"「年利2%なら、100万円に対する1年間の利息は2万円。年利5%なら5万円です」\n\n「借りる金額が同じでも、金利が変わると資金調達コストが変わります。実際のローンでは返済期間や返済方法、固定・変動金利によって計算が異なります」","lessonTitle":"金利は『お金を借りる価格』","lesson":"年利2% → 利息2万円／年利5% → 利息5万円。差は3万円。金利上昇は事業の採算に影響するが、金利だけで投資の可否は決まらない。"},{"type":"narrative","speaker":"ミナ","text":"「3万円……。大したことないって言う人もいるだろうけど、私の店では小さくない額だよ」\n\nサトウはうなずいた。\n\n「だから、借りること自体が良いか悪いかではなく、借りたお金で何を生み出せるかが大切です」"},{"type":"choice","label":"判断 2 / 3","speaker":"サトウ","text":"「では仮に、オーブンによる追加利益が1年で6万円、借入による追加利息が5万円だとしましょう。ただし、利益は予測で、故障や売上の変動もあり得ます」\n\nミナがあなたを見る。「この数字なら買っていい？」","prompt":"主人公の判断を選ぶ","options":[{"text":"「予測上は差し引き1万円のプラス。でも余裕が薄いから、下振れも調べたい」","reply":"サトウ「その通り。予測利益が少し下がるだけで採算が変わる。返済能力や初期費用も確認しましょう」","insight":"利息だけを引いた簡略比較ではプラス1万円。ただし元本返済や設備の耐用年数、税金、運転資金なども本来は必要。","tone":"リスクを確認"},{"text":"「1万円でもプラスなら、計画を進める理由はある。次は資金繰りを確認しよう」","reply":"ミナ「少し希望が見えた。でも返済日にお金が足りなかったら困るね」","insight":"期待利益がプラスでも、資金繰りが安全とは限らない。利益と現金の流れは分けて考える。","tone":"成長を重視"},{"text":"「余裕が小さいなら、まず中古設備や少額投資の案も比べよう」","reply":"サトウ「代替案を比較するのは有効です。最初の案だけが選択肢ではありません」","insight":"設備の規模や調達方法を変えることでリスクを抑えられる場合がある。ただし性能や保守費用も比較したい。","tone":"代替案を探る"}]},{"type":"narrative","label":"第二幕｜広場の噂","speaker":"語り手","text":"銀行を出ると、広場がいつになく騒がしかった。\n\n商人のレオが掲示板を指さしている。\n\n『中央銀行、政策金利を引き上げ』\n\n「大変だ！ これじゃ株なんて全部下がる！」\n\n古書店のユイが、紙袋を抱えて立ち止まった。"},{"type":"narrative","speaker":"ユイ","text":"「全部、とは限らないわ」\n\n「金利が上がると、借入負担が増える企業もあるし、将来の利益を今の価値に直すときの評価も変わる。だけど、業種や景気によって影響は違うの」\n\nレオは首をかしげた。「未来のお金の価値？」"},{"type":"lesson","speaker":"ユイ","text":"「例えば、1年後にもらえる105円を、年5%で割り引けば今日の価値は100円。年2%で割り引けば約102.94円よ」\n\n「将来の金額が同じでも、割引率が高いほど現在価値は低くなる。株式評価にも似た考え方を使うの」","lessonTitle":"未来の利益を、今日の価値で考える","lesson":"1年後の105円 ÷ 1.02 ≒ 102.94円／÷ 1.05 = 100円。これは仕組みを学ぶための単純化した例。実際の株価は成長率やリスクなども反映する。"},{"type":"narrative","speaker":"語り手","text":"レオは掲示板を見つめ直した。\n\n「じゃあ、金利が上がると株価は下がりやすい。でも絶対じゃない……」\n\n「そう」とユイ。「それに、金利を上げた理由も大事。物価が上がりすぎているのか、景気が強いのか。ニュースの見出しだけでは足りないわ」"},{"type":"choice","label":"推理 3 / 3","speaker":"ユイ","text":"「街には三つの会社があるわ。借入で急成長を狙う発明工房、現金が豊富な老舗の茶屋、海外にも売るパンの会社」\n\n「金利上昇のニュースを見たとき、最初に何を調べる？」","prompt":"主人公の調査方針を選ぶ","options":[{"text":"「借入額と返済条件を比べる。資金調達コストが違いそう」","reply":"ユイ「いい視点ね。特に借入依存度が高い会社では重要な手掛かりになるわ」","insight":"負債の規模、固定・変動金利、借換時期を確認する。","tone":"財務を調べる"},{"text":"「将来の成長期待と株価を比べる。評価が高すぎないか知りたい」","reply":"ユイ「それも大事。遠い将来の利益に期待する会社ほど、割引率の変化が効く場合があるわ」","insight":"将来キャッシュフローへの期待と現在の株価の関係を考える。","tone":"企業価値を調べる"},{"text":"「利上げの背景と、各社のお客さんへの影響を調べる」","reply":"ユイ「そうね。景気や需要を見ないまま、金利だけで判断するのは危険だわ」","insight":"金利上昇の背景、需要、価格転嫁力なども重要。","tone":"経済を調べる"}]},{"type":"narrative","label":"エピローグ｜焼きたての朝","speaker":"語り手","text":"数日後。〈こむぎの窓〉の窓辺に、小さな紙が貼られた。\n\n『新しいオーブンについて、もう少し調べます』\n\nミナは少し照れくさそうに笑う。\n\n「前なら、金利が上がったって聞いただけで諦めてた。でも今は、何を調べればいいか分かる気がする」"},{"type":"narrative","speaker":"ユイ","text":"「投資も同じよ。『上がる』『下がる』を急いで当てるより、何が価格を動かしているかを考えること」\n\n雨は上がっていた。\n\n広場の向こうで、パンの焼ける匂いが風に混ざる。\n\n次の事件は、値札が書き換えられた朝に始まる——。"},{"type":"ending","speaker":"第6章 完","text":"あなたは、金利が事業と株価に影響する三つの経路を学んだ。\n\n① 借入コスト　② 将来利益の現在価値　③ 景気や需要への影響\n\n選択に唯一の正解はない。大切なのは、判断の根拠を増やしていくこと。"}];let i=0;try{i=Number(localStorage.getItem("pya-invest-v4-scene")||0);if(!Number.isInteger(i)||i<0||i>=scenes.length)i=0}catch{}const $=id=>document.getElementById(id);function save(){localStorage.setItem("pya-invest-v4-scene",String(i))}function advance(){i=i===scenes.length-1?0:i+1;save();render()}function btn(text,fn,primary=false){const b=document.createElement("button");b.textContent=text;b.onclick=fn;if(primary)b.className="primary";$("choices").append(b)}function render(){const s=scenes[i];$("chapter").textContent=s.label||"第6章｜雨の日のオーブン";$("speaker").textContent=s.speaker;$("story").textContent=s.text;$("bar").style.width=((i+1)/scenes.length*100)+"%";$("choices").replaceChildren();$("result").replaceChildren();$("lesson").replaceChildren();$("prompt").textContent="";$("back").disabled=i===0;if(s.type==="choice"){$("prompt").textContent=s.prompt;s.options.forEach(o=>btn(o.text,()=>{$("choices").replaceChildren();const d=document.createElement("div");d.className="result";d.textContent=o.reply+"\n\n【考えるヒント】"+o.insight;$("result").append(d);btn("会話を続ける →",advance,true)}))}else{if(s.type==="lesson"){const d=document.createElement("div");d.className="lesson";const h=document.createElement("h3");h.textContent="📖 "+s.lessonTitle;const p=document.createElement("p");p.textContent=s.lesson;d.append(h,p);$("lesson").append(d)}btn(s.type==="ending"?"もう一度遊ぶ":"続きを読む →",advance,true)}}$("back").onclick=()=>{if(i>0){i--;save();render()}};$("restart").onclick=()=>{if(confirm("最初から読み直しますか？")){i=0;save();render()}};render();</script></body></html>
