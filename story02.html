<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#213e35"><title>株と街のものがたり｜物語版 0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6e8df;color:#263c33;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:680px;min-height:100dvh;margin:auto;background:#fcfaf4;box-shadow:0 0 35px #a3a69b33}header{background:#213e35;color:#fff;padding:21px 23px}header h1{font-size:21px;margin:5px 0}header small{color:#c8d9ca}.wrap{padding:20px 20px 45px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:17px}.chip{background:#e9ede5;border-radius:20px;padding:7px 11px;font-size:12px}.chapter{font-size:12px;letter-spacing:.16em;color:#668275;margin-bottom:7px}.scene{border-top:1px solid #d8d5c9;padding-top:19px}.scene h2{font-size:24px;line-height:1.5;margin:0 0 16px;font-family:serif}.narrative{font-family:serif;white-space:pre-line;line-height:2.15;font-size:16px;margin:16px 0 25px}.quote{border-left:3px solid #ad9870;padding:10px 14px;background:#f3efe4;line-height:1.9;margin:15px 0}.speaker{font-size:12px;font-weight:bold;color:#816e4b}.choices{display:grid;gap:10px}.choice{background:white;border:1px solid #b9c8bb;border-radius:12px;padding:15px;text-align:left;color:#234739;font:inherit;line-height:1.7;cursor:pointer}.choice strong{display:block}.choice small{display:block;color:#65796b;margin-top:3px}.choice:disabled{opacity:.45}.primary{background:#275c48;color:#fff}.panel{background:#eef1e9;border-radius:14px;padding:14px;margin:16px 0}.panel h3{margin:0 0 8px;font-size:15px}.panel p{margin:7px 0;font-size:14px;line-height:1.8}.stock{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.stock b{font-size:22px}.up{color:#a34b34}.down{color:#336e96}.trade{display:flex;gap:8px;align-items:center;margin-top:10px}.trade input{width:80px;padding:11px;font:inherit;border:1px solid #a7b7a8;border-radius:9px}.trade button{flex:1;text-align:center;padding:11px;border:1px solid #8da897;border-radius:9px;background:white;font:inherit}.note{font-size:13px;line-height:1.7;color:#607469}.result{background:#e6f0e5;border-left:4px solid #6e9c7c;padding:12px;white-space:pre-line;line-height:1.8;margin:12px 0}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:28px}.footer button{background:transparent;border:0;text-decoration:underline;color:#5c7565;font:inherit;font-size:13px}.footer a{color:#5c7565;font-size:13px}.ending{border:1px solid #d2c6a8;border-radius:14px;padding:18px;background:#f5f0e3}
</style></head><body><main><header><small>PYĀ INVEST GAME · STORY PROTOTYPE 0.2</small><h1>株と街のものがたり</h1><small>お金の選択が、人との物語になる。</small></header><div class="wrap"><div class="meta" id="meta"></div><section class="scene"><div class="chapter" id="chapter"></div><h2 id="heading"></h2><div class="narrative" id="story"></div><div id="extra"></div><div class="choices" id="choices"></div></section><div class="footer"><button id="reset">最初からやり直す</button><a href="/mvp01.html">旧MVP 0.1</a></div><p class="note">これは第1〜2章の物語試作。価格・確率・収入は架空。選択は端末内に自動保存されます。</p></div></main><script>
const KEY='pya-invest-story-v02',prices=[1000,1040,970,1080],yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';
const initial=()=>({step:0,cash:100000,route:'',bond:0,clue:0,work:0,shares:0,basis:0,realized:0,day:1,choice:'',income:0,tradeMsg:'',ending:'',history:[]});
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||!Number.isInteger(s.step))s=initial();
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(s));
function choose(text,fn,desc){const b=document.createElement('button');b.className='choice';const strong=document.createElement('strong');strong.textContent=text;b.append(strong);if(desc){const small=document.createElement('small');small.textContent=desc;b.append(small)}b.onclick=()=>{fn();save();render()};$('choices').append(b);return b}
function next(step){s.step=step}
function line(text){const d=document.createElement('div');d.className='panel';d.textContent=text;$('extra').append(d)}
function panel(title,body){const d=document.createElement('div');d.className='panel';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=body;d.append(h,p);$('extra').append(d)}
function market(price){const d=document.createElement('div');d.className='panel';const prev=prices[s.day-2];const diff=prev===undefined?0:price-prev;const pct=prev===undefined?0:100*diff/prev;const pnl=s.shares*price-s.basis;d.innerHTML='<h3>みどりマート｜株式市場</h3><div class="stock"><b>'+yen(price)+'</b><span class="'+(diff>=0?'up':'down')+'">前日比 '+(diff>=0?'+':'−')+yen(Math.abs(diff))+' ('+(pct>=0?'+':'')+pct.toFixed(1)+'%)</span></div><p>保有 '+s.shares+'株｜平均取得 '+(s.shares?yen(s.basis/s.shares):'—')+'｜含み損益 '+(pnl>=0?'+':'−')+yen(Math.abs(pnl))+'</p><p>確定損益 '+(s.realized>=0?'+':'−')+yen(Math.abs(s.realized))+'</p>';const t=document.createElement('div');t.className='trade';const q=document.createElement('input');q.type='number';q.min='1';q.step='1';q.inputMode='numeric';q.value='1';q.setAttribute('aria-label','売買数量');const buy=document.createElement('button'),sell=document.createElement('button');buy.textContent='買う';sell.textContent='売る';t.append(q,buy,sell);d.append(t);const amount=document.createElement('p');amount.className='note';d.append(amount);const qty=()=>{const n=Number(q.value);return Number.isSafeInteger(n)&&n>0?n:0};function update(){const n=qty();amount.textContent=n?'数量 '+n+'株｜売買額 '+yen(n*price):'1以上の整数を入力';buy.disabled=!n||n*price>s.cash;sell.disabled=!n||n>s.shares}q.oninput=update;buy.onclick=()=>{const n=qty();if(!n||n*price>s.cash)return;s.cash-=n*price;s.shares+=n;s.basis+=n*price;s.tradeMsg='購入：現金 −'+yen(n*price)+'／'+n+'株。購入は損失ではない。';s.history.push('買 '+n+'株');save();render()};sell.onclick=()=>{const n=qty();if(!n||n>s.shares)return;const avg=s.basis/s.shares,pnl=n*(price-avg);s.cash+=n*price;s.shares-=n;s.basis=s.shares?Math.max(0,s.basis-n*avg):0;s.realized+=pnl;s.tradeMsg='売却：現金 ＋'+yen(n*price)+'／確定損益 '+(pnl>=0?'+':'−')+yen(Math.abs(pnl));s.history.push('売 '+n+'株');save();render()};update();$('extra').append(d);if(s.tradeMsg){const n=document.createElement('div');n.className='result';n.textContent=s.tradeMsg;$('extra').append(n)}}
function render(){ $('meta').textContent='';[['日付',s.day+'日目'],['現金',yen(s.cash)],['保有',s.shares+'株']].forEach(([k,v])=>{const d=document.createElement('div');d.className='chip';d.textContent=k+' · '+v;$('meta').append(d)});$('extra').replaceChildren();$('choices').replaceChildren();
const set=(ch,h,story)=>{$('chapter').textContent=ch;$('heading').textContent=h;$('story').textContent=story};
switch(s.step){
case 0:set('第一章 · 帰ってきた店','雨上がりの靴屋','駅前のみどりマートで牛乳を買ってから、商店街へ向かった。店先には「駅向こうに新店舗予定」の小さな張り紙。最近、レジの列が前より長い気がする。\n\n商店街を抜けると、見慣れた看板が傾いていた。\n\n子どもの頃、ここは革と磨き油の匂いがする場所だった。じいちゃんは黙って靴を磨き、仕上がると必ず「もう一度歩けるな」と言った。\n\n店のシャッターは半分だけ開いている。中には、使い込まれた木の椅子と、片足だけの革靴。');choose('店に入って、じいちゃんに声をかける',()=>next(1));break;
case 1:set('第一章 · 帰ってきた店','「直せるものは、直したい」','じいちゃんはもう引退していた。店を畳むつもりで、道具を箱に詰めている。\n\n「看板が危なくてな。業者に頼めば八万円。仮のものなら二万円だそうだ」\n\nじいちゃんは、古い看板の「靴」の字を指でなぞる。\n\n「お前がここを使うなら、好きにしていい。だが、昔と同じ客が来るとは限らんぞ」');choose('「あの看板を残したい」と伝える',()=>{s.bond++;s.choice='memory';next(2)},'思い出を優先する気持ちを伝える');choose('「まずはお客さんが来るか試そう」と伝える',()=>{s.clue++;s.choice='trial';next(2)},'慎重に始めたいと伝える');break;
case 2:set('第一章 · 帰ってきた店','三つの始め方','貯金は十万円。看板を直せば店らしくなる。でも、そのお金はしばらく戻ってこない。\n\n窓の外では、みどりマートの買い物袋を下げた人が歩いていた。駅前の工事も始まり、商店街の客足は昔と違う。\n\nじいちゃんは決めてくれない。自分で選ぶしかない。');panel('商店街の掲示板','「駅前工事の予定あり」「来週は雨が多い見込み」。どちらも客足に影響しそうだが、確実ではない。');[['昔の看板を直す（−80,000円）','new',80000],['仮看板で様子を見る（−20,000円）','temp',20000],['看板なしで靴磨きから始める（0円）','street',0]].forEach(([t,r,c])=>choose(t,()=>{s.route=r;s.cash-=c;s.history.push('開業 '+r);next(3)}));break;
case 3:set('第一章 · 帰ってきた店','封筒の中の会社','開業の準備をしていると、古い帳簿の間から封筒が落ちた。\n\n「北浜電力　株式関係書類」\n\n聞いたことのない名前だった。封筒の隅には、何年も前の日付がある。\n\n「それはわしのだ。昔、うちの常連に電力会社の人がいてな……」\n\nじいちゃんは封筒を手に取り、少し懐かしそうに笑った。');choose('「その人と株に、どんな関係が？」と聞く',()=>{s.bond++;next(4)});choose('「その株、今はどうなってるの？」と聞く',()=>{s.clue++;next(4)});break;
case 4:set('第一章 · 帰ってきた店','お金だけじゃない理由','「仕事帰りによく靴を磨きに来てくれた人でな。ある日、勤め先が経営難で大変だって、ずいぶん落ち込んでいた」\n\nじいちゃんは、古い椅子の背をなでた。\n\n「それで、少しでも応援になればと思って株を買ったんだ。大した額じゃなかったがな」\n\n「その人は、今も来るの？」\n\n「いや、もうずいぶん顔を見ていない。あの人、元気にしているといいんだが」\n\nじいちゃんは封筒を帳簿の間に戻した。そこには、まだ何枚か古い手紙も挟まっていた。\n\n封筒はじいちゃんのものだ。あなたの貯金が増えたわけではない。\n\nその夜、じいちゃんが買った株についてもう少し知りたくなり、商店街の本屋へ向かった。');choose('本屋へ向かう',()=>{s.day=2;next(5)},'ユイなら何か知っているかもしれない');break;
case 5:set('第二章 · 本屋と商人','ユイの古書店','本屋の奥で、ユイが新聞を束ねていた。じいちゃんの古い株式書類の話をすると、ユイは「北浜電力」という名前と日付をメモした。\n\n「ちょっと調べてみるわ。わかったら教えるね」\n\n「株を買うって、その会社の一部を持つことなの。じいちゃんの株をあなたが使えるわけじゃないけど、自分のお金で会社に投資することはできる」\n\n帰りに牛乳を買ったみどりマートのチラシが、新聞の間に挟まっていた。\n\n「そういえば今朝、店先に新店舗の張り紙があった。最近レジも混んでる気がするんだ」\n\n「じゃあ、あの店を例に、会社を調べる練習をしてみる？」\n\n「知っている会社を調べるのはいい入口ね。でも、知っているから買う、では足りないわ」\n\nユイはみどりマートの売上表と、別の新聞記事を並べる。\n\n「売上が伸びていても、みんながもっと伸びると思っていたら、株価は下がることがあるの」\n\nそのとき、入口のベルが勢いよく鳴った。');choose('ユイに会社の資料を見せてもらう',()=>{s.clue+=2;next(6)},'売上と市場の期待を比べる');choose('入ってきた人の話を聞く',()=>{s.bond++;next(6)},'商店街の噂も気になる');break;
case 6:set('第二章 · 本屋と商人','レオの確信','「聞いたか！ みどりマート、駅の向こうに新店舗を出すらしい！ 俺、あそこの惣菜好きなんだよ！」\n\nレオは興奮している。ユイは腕を組んだ。\n\n「新店舗の話は先月から出ているわ。大事なのは、今の株価にどれくらい期待が入っているかよ。新しい店を出すにはお金もかかるし」\n\nレオは言い返しかけて、口をつぐんだ。\n\n「……でもさ、買わずに上がったら、悔しいだろ？ 俺はあの店、伸びると思うんだ」\n\nその言葉は、少しだけ胸に刺さった。毎週使う店だからこそ、これからも続いてほしい。新店舗が成功したら、もっと便利になるだろう。でも、好きな店だからといって、その株をどんな値段でも買っていいわけではない。');panel('今日わかったこと','会社が成長することと、株価が上がることは同じではない。市場がすでに成長を予想している場合がある。');choose('翌朝、店を開けるか調べ物をするか決める',()=>{s.day=3;next(7)});break;
case 7:set('第二章 · 本屋と商人','朝の選択','朝、商店街に小雨が降っていた。\n\n駅前の工事現場では作業員が増えている。一方、靴屋の前を通る人はまばらだ。\n\n昼には、みどりマートの新店舗計画について投資家向けの説明会があるらしい。ユイは「新店舗の費用を聞いておきたい」と言っていた。\n\nじいちゃんが湯呑みを置く。\n\n「店を開けても客が来るとは限らん。だが、調べ物をしても答えが出るとは限らんぞ」');panel('朝の判断材料','雨で通行人は少なめ。工事関係者の靴修理需要は増えるかもしれない。説明会では出店費用の情報が得られる見込み。');choose('靴屋を営業する',()=>{const roll=Math.random();const base=s.route==='new'?[0,1600,3600,7500]:s.route==='temp'?[0,1200,2600,5200]:[0,900,1900,3800];const ix=roll<.28?0:roll<.66?1:roll<.91?2:3;s.income=base[ix];s.cash+=s.income;s.work++;s.choice='work';next(8)},'確実ではないが、現金収入の機会を取る');choose('説明会の情報を集める',()=>{s.clue+=2;s.choice='research';next(8)},'今日の営業収入を諦め、判断材料を増やす');break;
case 8:set('第二章 · 本屋と商人',s.choice==='work'?'店の戸を閉めたあと':'説明会の帰り道',s.choice==='work'?(s.income===0?'結局、今日は一人もお客さんが来なかった。じいちゃんは「そういう日もある」とだけ言う。\n\n夕方、レオが店に駆け込んできた。':'靴を磨く手を止めた頃には、説明会は終わっていた。今日の売上は'+yen(s.income)+'。\n\n夕方、レオが店に駆け込んできた。')+'\n\n「みどりマート、明日は大きく動くかもしれないぞ！」\n\nユイは「売上だけでなく、出店費用も見て」と言った。だが詳しい数字は聞けていない。': 'ユイがノートを開いた。\n\n「新店舗の売上予想は強気。でも初期費用が大きい。利益が期待ほど伸びない可能性もあるわ」\n\n情報は増えたが、明日の株価はわからない。\n\nレオは「それでも買う！」と息巻いている。');if(s.choice==='work')panel('今日の営業結果','収入：+'+yen(s.income)+'。説明会の詳しい内容は未確認。');else panel('今日の調査結果','営業収入：0円。新店舗の費用負担と、市場の強気な期待を確認できた。株価の上昇・下落は保証されない。');market(prices[0]);choose('自分の判断を決めて、翌日へ',()=>{s.day=4;s.tradeMsg='';next(9)},'売買しない選択もできる');break;
case 9:set('第二章 · 本屋と商人','市場が動いた朝','翌朝、みどりマートの株価が動いた。\n\nレオは新聞を握りしめている。\n\n「昨日買っておけばよかったって思う日も、売ればよかったって思う日もある。毎日そうだ」\n\nユイは首を振る。\n\n「結果を見てから、昨日の自分を責めるのは簡単。でも昨日わかっていたことだけで判断を振り返らないと」\n\n店の前には、修理を待つ一足の靴が置かれていた。');market(prices[1]);choose('じいちゃんに今日のことを話す',()=>{s.tradeMsg='';next(10)});break;
case 10:set('第二章 · 本屋と商人','もう一度歩けるように','じいちゃんは最後まで話を聞いてから、磨き終えた靴を棚に置いた。\n\n「上がった下がったは、明日もある。でも、お前が何を見て決めたかは、忘れん方がいい」\n\n外では、レオがユイに何か言い返している。二人とも、きっと明日も同じように言い合うのだろう。\n\n靴屋を続けるか。会社を調べるか。みどりマートの株を持つか。\n\nどれも、まだ答えは出ていない。');{const total=s.cash+s.shares*prices[1];panel('今回の記録','現金 '+yen(s.cash)+'／株式 '+yen(s.shares*prices[1])+'／合計 '+yen(total)+'。靴屋の営業 '+s.work+'回、調査の手がかり '+s.clue+'。');panel('振り返り','株を持たずに働く選択も、仕事を休んで調べる選択もあり得る。結果だけでなく、その時点の情報と理由を考える。');choose('別の選択でもう一度',()=>{s=initial()});choose('このままエピローグを読む',()=>next(11));}break;
case 11:set('つづく · 小さな伏線','パン屋のオーブン','夕方、パン屋のミナが靴屋を訪ねてきた。\n\n「新しいオーブンを買おうか迷ってるの。借りるお金の利息が、前より高いんだって」\n\n店の奥で、じいちゃんが古い帳簿を閉じた。\n\n商店街の外れでは、工事用の車が何台も走っている。\n\nこの街のお金は、目に見えないところでも動いている。\n\n——第3章へ続く。');choose('最初から遊ぶ',()=>{s=initial()});break;
default:s=initial();save();render();return;
}}
$('reset').onclick=()=>{if(confirm('物語の進行を消して最初から始めますか？')){s=initial();save();render()}};render();
</script></body></html>
