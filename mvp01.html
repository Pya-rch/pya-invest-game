<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#234f41"><title>株と街のものがたり｜MVP 0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#e9efe9;color:#294337;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:620px;margin:auto;min-height:100dvh;background:#fffdf6;padding-bottom:40px}header{background:#234f41;color:white;padding:25px 20px 18px}h1{font-size:23px;margin:5px 0}small{opacity:.8}.wrap{padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#edf2e9;padding:11px;border-radius:12px;font-size:12px}.stat b{display:block;font-size:17px;margin-top:4px}.scene{background:#f4eddb;border-radius:16px;padding:18px;margin:16px 0;line-height:1.85;white-space:pre-line}.scene h2{font-size:18px;margin:0 0 8px}.choices{display:grid;gap:10px}button{font:inherit;border:1px solid #a4b9aa;background:white;color:#234f41;border-radius:12px;padding:14px;text-align:left;line-height:1.5;cursor:pointer}button:disabled{opacity:.4}.primary{background:#27694e;color:white;border-color:#27694e}.muted{color:#607a69;font-size:13px;line-height:1.7}.price{font-size:24px;font-weight:800}.foot{display:flex;gap:10px;margin-top:20px}.foot button{flex:1;font-size:13px}.notice{background:#e6f2e7;border-left:4px solid #39775b;border-radius:8px;padding:12px;margin:12px 0;font-weight:700;white-space:pre-line}.tradebox{border:1px solid #c6d6c8;border-radius:12px;padding:12px;margin:6px 0}.tradebox label{display:block;font-size:13px;margin-bottom:6px}.tradebox input{width:100%;font:inherit;font-size:18px;border:1px solid #a4b9aa;border-radius:8px;padding:10px;margin-bottom:8px}.tradebox button{width:100%;margin-top:5px}.tradebox .muted{margin:4px 0 8px}.pill{display:inline-block;background:#e0eee4;padding:4px 9px;border-radius:30px;font-size:12px;margin:4px 3px 0 0}</style><main><header><small>PYĀ INVEST GAME · MVP 0.1</small><h1>🌿 株と街のものがたり</h1><div>じいちゃんの靴屋から、投資の世界へ。</div></header><div class="wrap"><div class="stats"><div class="stat">日付<b id="day"></b></div><div class="stat">現金<b id="cash"></b></div><div class="stat">保有株<b id="shares"></b></div></div><div class="scene" id="scene"></div><div class="choices" id="choices"></div><div class="foot"><button id="restart">↺ 最初から</button><button onclick="location.href='/'">既存の物語へ</button></div><p class="muted">架空の株価と収益による試作品です。投資助言ではありません。進行はこのブラウザ内に保存されます。</p></div></main><script>
const prices=[1000,980,1040,960,1080,900,1060];const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';const key='pya-town-mvp01';let s;try{s=JSON.parse(localStorage.getItem(key))}catch{}if(!s||!Number.isInteger(s.day))s={day:1,cash:100000,shares:0,route:null,seen:false,history:[],research:false,work:0};if(typeof s.costBasis!=='number')s.costBasis=0;if(typeof s.notice!=='string')s.notice='';const el=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(s))}function button(t,fn,primary=false){let b=document.createElement('button');b.textContent=t;if(primary)b.className='primary';b.onclick=()=>{fn();save();render()};el('choices').append(b);return b}function tradeForm(p){const box=document.createElement('div');box.className='tradebox';box.innerHTML='<label for="qty">売買数量（株）</label><input id="qty" type="number" min="1" max="999999" step="1" inputmode="numeric" value="1"><div class="muted" id="estimate"></div>';el('choices').append(box);const inp=box.querySelector('input');const est=box.querySelector('#estimate');const buy=document.createElement('button'),sell=document.createElement('button');buy.className='primary';buy.textContent='購入する';sell.textContent='売却する';box.append(buy,sell);function quantity(){const n=Number(inp.value);return Number.isSafeInteger(n)&&n>0?n:0}function update(){const n=quantity();est.textContent=n?'概算売買額：'+yen(n*p)+'（'+n+'株 × '+yen(p)+'）':'1以上の整数を入力してください';buy.disabled=!n||n*p>s.cash;sell.disabled=!n||n>s.shares}inp.addEventListener('input',update);buy.onclick=()=>{const n=quantity();if(!n||n*p>s.cash)return;s.cash-=n*p;s.shares+=n;s.costBasis+=n*p;s.notice='購入：'+n+'株／現金 −'+yen(n*p)+'／株式資産 ＋'+yen(n*p)+'\n購入時の売買損益：0円';s.history.push('買：'+n+'株 '+yen(n*p));save();render()};sell.onclick=()=>{const n=quantity();if(!n||n>s.shares)return;const avg=s.costBasis/s.shares;const pnl=n*(p-avg);s.cash+=n*p;s.shares-=n;s.costBasis=s.shares===0?0:Math.max(0,s.costBasis-n*avg);s.notice='売却：'+n+'株／現金 ＋'+yen(n*p)+'\n確定損益：'+(pnl>=0?'＋':'−')+yen(Math.abs(pnl))+'（平均取得単価 '+yen(avg)+'）';s.history.push('売：'+n+'株／損益 '+(pnl>=0?'+':'−')+yen(Math.abs(pnl)));save();render()};update()}function advance(){s.day=Math.min(8,s.day+1);s.seen=false;s.notice=''}function render(){el('day').textContent=s.day>7?'結末':s.day+'日目';el('cash').textContent=yen(s.cash);el('shares').textContent=s.shares+'株';el('choices').replaceChildren();let d=el('scene');if(!s.route){d.innerHTML='<h2>第1章｜じいちゃんの靴屋</h2>古い靴屋の扉を開けると、じいちゃんが笑った。\n\n「看板が壊れてな。店をどう始めるか、お前が決めていいぞ」\n\n貯金は10万円。';[['新しい看板をつける（8万円）','new',80000],['仮の看板で小さく開店（2万円）','temp',20000],['路上の靴磨きから始める（0円）','street',0]].forEach(([t,r,c])=>button(t,()=>{s.route=r;s.cash-=c;s.history.push('開業：'+t);s.notice='開業費用 −'+yen(c)},r==='temp'));return}if(s.day>7){const noTrade=s.history.every(x=>!x.startsWith('買')&&!x.startsWith('売'));d.innerHTML='<h2>第2章・おわり</h2>'+(noTrade?'🥿 靴職人・現金主義エンド！\n\nじいちゃん「株を買わずに店を守ったか。それもお前の選択だ」':'📈 市場と向き合う第一歩\n\nユイ「利益が出たかより、なぜその判断をしたかが大切よ」')+'\n\n最終資産：'+yen(s.cash+s.shares*prices[6])+'\n現金：'+yen(s.cash)+'／保有：'+s.shares+'株\n\n'+s.history.slice(-6).join('\n');button('別の選択でもう一度',()=>{s={day:1,cash:100000,shares:0,route:null,seen:false,history:[],research:false,work:0,costBasis:0,notice:''}},true);return}const p=prices[s.day-1];let opening=s.day===1?'じいちゃん「まずは自分の足で街を歩いてみな」':s.day===2?'引き出しから古い株券の封筒が見つかった。じいちゃんは懐かしそうに目を細める。':s.day===3?'古書店のユイ「株は会社の一部を持つこと。でも上がるとは限らないの」':s.day===4?'商人レオ「みどりマート、いい感じだぞ！」ユイ「噂だけで決めないでね」':s.day===5?'みどりマートの新しい出店計画が街の新聞に載った。':s.day===6?'レオ「株価が下がってる！ どうしよう……」': 'パン屋のミナ「新しいオーブンを買うか迷ってるの。お金の使い方って難しいね」';let msg='<h2>第'+(s.day<3?'1':'2')+'章｜'+(s.day<3?'じいちゃんの靴屋':'本屋と商人')+'</h2>'+opening+'\n\n';if(s.day>=3){const diff=p-prices[s.day-2];const pct=diff/prices[s.day-2]*100;const pnl=s.shares*p-s.costBasis;msg+='📊 みどりマート：<span class="price">'+yen(p)+'</span>／株\n前日比：'+(diff>=0?'＋':'−')+yen(Math.abs(diff))+'（'+(pct>=0?'+':'')+pct.toFixed(1)+'%）\n平均取得単価：'+(s.shares?yen(s.costBasis/s.shares):'保有なし')+'\n保有評価額：'+yen(s.shares*p)+'\n含み損益：'+(pnl>=0?'＋':'−')+yen(Math.abs(pnl))+'\n'}msg+='\n<span class="pill">'+({new:'新看板',temp:'仮看板',street:'靴磨き'}[s.route])+'</span>';if(s.research)msg+='<span class="pill">企業調査済み</span>';d.innerHTML=msg+(s.notice?'<div class="notice">'+s.notice+'</div>':'');if(!s.seen){button('靴の仕事をする（営業収入を得る）',()=>{let earn=s.route==='new'?3500:s.route==='temp'?2400:1700;s.cash+=earn;s.work++;s.seen=true;s.history.push(s.day+'日目：仕事 +'+yen(earn));s.notice='靴の仕事：現金 ＋'+yen(earn)});button('街を歩いて情報を集める',()=>{s.research=true;s.seen=true;s.history.push(s.day+'日目：調査');s.notice='企業情報を調べた（現金の増減なし）'});button('店の片付けをする',()=>{s.seen=true;s.history.push(s.day+'日目：片付け');s.notice='店の片付けをした（現金の増減なし）'})}else{if(s.day>=3){tradeForm(p)}button('翌日へ進む →',advance,true)}}
el('restart').onclick=()=>{if(confirm('進行を消して最初から始めますか？')){localStorage.removeItem(key);location.reload()}};render();</script></html>
